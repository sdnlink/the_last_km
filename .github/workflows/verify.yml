name: Verify release
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'setuptools>=68' wheel
      - run: python -m compileall -q auto_moniter tests
      - run: python -m unittest discover -q
      - run: git diff --check
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Validate installed wheel outside source directory
        shell: bash
        run: |
          python -m venv /tmp/monitor-release
          /tmp/monitor-release/bin/pip install --no-index dist/*.whl
          cd /tmp
          /tmp/monitor-release/bin/auto-moniter --version
          /tmp/monitor-release/bin/auto-moniter doctor --cwd /tmp
          /tmp/monitor-release/bin/auto-moniter selftest
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-python-${{ matrix.python }}
          path: dist/*.whl
