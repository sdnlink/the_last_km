    <dialog id="confirm-dialog" class="confirm-dialog">
      <div class="dialog-heading"><h2>停止当前任务？</h2></div>
      <p>监督器会终止当前执行并保存状态。之后可以从检查点恢复。</p>
      <div class="dialog-footer">
        <button class="button secondary" data-close="confirm-dialog">
          返回</button
        ><button class="button danger" id="confirm-stop">停止任务</button>
      </div>
    </dialog>
