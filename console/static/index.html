<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>__PAGE_TITLE__ · Auto Moniter 开发控制台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <!-- PAGE_STYLES -->
    <script src="/app.js" type="module"></script>
  </head>
  <body data-page="__PAGE__" data-task-id="__TASK_ID__" data-workspace="__WORKSPACE__" data-needs-setup="__NEEDS_SETUP__">
    <svg
      class="icon-sprite"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs>
        <symbol id="i-grid" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </symbol>
        <symbol id="i-task" viewBox="0 0 24 24">
          <path
            d="m3 6 2 2 4-4M12 6h9M3 13l2 2 4-4M12 13h9M3 20l2 2 4-4M12 20h9"
          />
        </symbol>
        <symbol id="i-chip" viewBox="0 0 24 24">
          <rect x="6" y="6" width="12" height="12" rx="2" />
          <path d="M9 1v5m6-5v5M9 18v5m6-5v5M1 9h5m-5 6h5m12-6h5m-5 6h5" />
          <rect x="9" y="9" width="6" height="6" rx="1" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="M5 12h14m-5-5 5 5-5 5" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path d="M20 7v5h-5M4 17v-5h5" />
          <path d="M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1" />
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
          <path
            d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"
          />
        </symbol>
        <symbol id="i-terminal" viewBox="0 0 24 24">
          <path d="m4 6 6 6-6 6m9 0h7" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
          <path d="m6 6 12 12M18 6 6 18" />
        </symbol>
        <symbol id="i-server" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="7" rx="2" />
          <rect x="3" y="14" width="18" height="7" rx="2" />
          <path d="M7 6.5h.1M7 17.5h.1M16 6.5h2m-2 11h2" />
        </symbol>
      </defs>
    </svg>
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Auto Moniter 首页"
        ><img src="/favicon.svg" alt="" width="34" height="34" /><span
          >auto<span class="brand-light">moniter</span
          ><small>DEVELOPMENT CONSOLE</small></span
        ></a
      >
      <div class="workspace">
        <span class="workspace-avatar">A</span
        ><span
          >本地工作空间<small id="workspace-name">Local workspace</small></span
        ><span class="workspace-dot"></span>
      </div>
      <button type="button" class="button primary sidebar-create" data-create-task>
        <svg aria-hidden="true"><use href="#i-plus" /></svg><span>创建任务</span>
      </button>
      <button type="button" class="button secondary navigation-toggle" data-toggle-navigation aria-expanded="false" aria-controls="primary-navigation">功能菜单</button>
      <nav id="primary-navigation" class="primary-navigation" data-expanded="false" aria-label="主导航">
        <!-- SIDE_NAVIGATION -->
      </nav>
      <div class="sidebar-footer">
        <div class="engine-status">
          <span class="live-dot"></span>监督引擎<span class="muted">CLI</span>
        </div>
        <p>让需求持续推进，直到验收通过。</p>
        <span class="version">AUTO MONITER / LOCAL</span>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div class="breadcrumb">
          工作空间 <span>/</span> <strong id="breadcrumb">__PAGE_TITLE__</strong>
        </div>
        <div class="topbar-right">
          <span id="connection" class="connection"
            ><span class="live-dot"></span>正在连接</span
          ><span class="top-divider"></span><span class="local-avatar">SK</span>
        </div>
      </header>
      <main>
        <div class="page-heading">
          <div>
            <div class="eyebrow">YOUR DEVELOPMENT, IN MOTION</div>
            <h1 id="page-title">__PAGE_TITLE__<span class="heading-dot">.</span></h1>
            <p id="page-subtitle">__PAGE_SUBTITLE__</p>
          </div>
        </div>
        <div
          class="connection-error"
          id="connection-error"
          role="alert"
          hidden
        ></div>
        <!-- PAGE_CONTENT -->
        <footer class="page-footer">
          <span><span class="live-dot"></span>每个任务，都向完成再近一步。</span
          ><span
            >BUILT FOR CONTINUOUS DELIVERY
            <span class="footer-mark">↗</span></span
          >
        </footer>
      </main>
    </div>
    <div id="dialog-root"></div><div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
