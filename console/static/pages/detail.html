        <section id="detail-page" class="task-detail-page" data-section="__DETAIL_SECTION__">
          <section class="panel task-workspace" aria-labelledby="detail-title">
          <div class="task-detail-top"><!-- DETAIL_BACK --><span class="subtle-badge">每 3 秒同步</span></div>
          <header class="task-detail-heading">
            <div class="task-workspace-title">
              <h1 id="detail-title">任务工作详情</h1>
              <p id="detail-project"></p>
              <a id="detail-migrated-from" hidden>查看原任务</a>
              <a id="detail-migrated-to" hidden>查看续做任务</a>
            </div>
            <div class="detail-page-actions"><div id="detail-actions"></div><div class="detail-edit-actions"><button class="button secondary" id="detail-open-direction">调整当前需求</button><button class="button primary" id="detail-open-requirement-queue">追加排队需求</button></div></div>
          </header>
          <div id="detail-current-state"></div>
          <div id="detail-local-preview" class="detail-edit-actions" hidden></div>
          <!-- DETAIL_TABS -->
          </section>
          <!-- DETAIL_CONTENT -->
          <dialog id="browser-captcha-dialog" aria-labelledby="browser-captcha-title">
            <form id="browser-captcha-form">
              <div class="dialog-heading"><h2 id="browser-captcha-title">填写现场浏览器验证码</h2></div>
              <div class="form-body">
                <p id="browser-captcha-role"></p>
                <img id="browser-captcha-image" alt="现场登录验证码">
                <label>验证码 <input name="code" required pattern="[A-Za-z0-9]{4}" maxlength="4" autocomplete="off"></label>
                <p id="browser-captcha-error" role="alert" hidden></p>
              </div>
              <div class="dialog-footer">
                <button class="button secondary" type="button" data-close="browser-captcha-dialog">暂不填写</button>
                <button class="button primary" type="submit">提交并继续</button>
              </div>
            </form>
          </dialog>
          <dialog id="preview-backend-dialog" aria-labelledby="preview-backend-title">
            <form id="preview-backend-form">
              <div class="dialog-heading"><h2 id="preview-backend-title">填写测试后端</h2></div>
              <div class="form-body">
                <p id="preview-backend-reason"></p>
                <label>测试后端地址 <input name="backend" type="url" autocomplete="off" required maxlength="500"></label>
                <p id="preview-backend-error" role="alert" hidden></p>
              </div>
              <div class="dialog-footer">
                <button class="button secondary" type="button" data-close="preview-backend-dialog">暂不填写</button>
                <button class="button primary" type="submit">连接并继续</button>
              </div>
            </form>
          </dialog>
        </section>
