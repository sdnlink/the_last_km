<section class="panel setup-intro">
  <div><span class="eyebrow">AGENT WORKSPACE</span><h2 id="setup-title">选择你的 Agent</h2><p>选择执行器，点击名称配置模型与认证。已安装的 CLI 和现有登录可直接复用。</p></div>
  <div class="setup-actions"><button class="button secondary" id="setup-detect">重新检测</button><button class="button secondary" id="setup-install-selected">安装选中项</button><button class="button primary" id="setup-save">保存配置</button><button class="button primary" id="setup-complete">保存并进入控制台 →</button></div>
</section>
<div class="setup-overview"><p class="setup-notice">API Key 仅保存在当前用户可读的本地配置中，保存后不回显。CLI 检测不代表账户已登录或模型调用权限可用。</p><span id="setup-count" class="setup-count"></span></div>
<div id="setup-error" class="connection-error" role="alert" hidden></div>
<section class="panel setup-jobs" id="setup-jobs-panel" tabindex="-1" hidden>
  <div class="panel-heading"><div><span class="eyebrow">INSTALLATION</span><h2 id="setup-jobs-title">当前安装</h2><p id="setup-jobs-summary" role="status">安装状态自动更新，详细输出按需展开。</p></div></div>
  <div id="setup-jobs"></div>
</section>
<div class="setup-list-heading"><div><h2>Agent 列表</h2><p>点击名称打开配置；勾选决定是否在任务中启用。</p></div><span>配置草稿会保留，保存后生效</span></div>
