<section class="task-overview" aria-label="任务概况">
  <button class="task-metric" data-task-scope="active"><span class="metric-label"><span class="metric-dot active-dot"></span>正在执行</span><strong id="metric-active">—</strong><small>查看当前进展 →</small></button>
  <button class="task-metric needs-attention" data-task-scope="attention"><span class="metric-label"><span class="metric-dot"></span>需要处理</span><strong id="metric-attention">—</strong><small>先解决阻塞，再继续 →</small></button>
  <button class="task-metric" data-task-scope="queued"><span class="metric-label">待启动</span><strong id="metric-queued">—</strong><small>已保存，等待开始 →</small></button>
  <button class="task-metric" data-task-scope="done"><span class="metric-label">已完成交付</span><strong id="metric-done">—</strong><small>查看验收与提交 →</small></button>
</section>
<section class="panel tasks-panel" id="tasks-panel">
  <div class="panel-heading task-list-heading"><div><h2>任务清单 <span id="task-count" class="count-badge">0</span></h2><p>先看当前工作和处理建议，再查看运行细节。</p></div><div class="task-heading-actions"><button class="icon-button" id="refresh" title="刷新数据" aria-label="刷新数据"><svg><use href="#i-refresh" /></svg></button><button class="button primary" data-create-task><svg aria-hidden="true"><use href="#i-plus" /></svg>创建任务</button></div></div>
  <div class="task-list-toolbar">
    <label class="task-search"><svg aria-hidden="true"><use href="#i-search" /></svg><input id="search" type="search" placeholder="搜索任务、项目或执行器" aria-label="搜索任务" /></label>
    <label class="task-sort"><span>排序</span><select id="task-sort" aria-label="任务排序"><option value="newest">最近创建</option><option value="priority">优先处理</option><option value="oldest">最早创建</option></select></label>
  </div>
  <div class="filters" id="filters" role="group" aria-label="任务状态筛选">
    <button class="filter active" data-filter="all" aria-pressed="true">全部任务</button><button class="filter" data-filter="active" aria-pressed="false">运行中 <span id="filter-active">0</span></button><button class="filter" data-filter="attention" aria-pressed="false">需要处理</button><button class="filter" data-filter="waiting" aria-pressed="false">等待处理</button><button class="filter" data-filter="paused" aria-pressed="false">已暂停</button><button class="filter" data-filter="queued" aria-pressed="false">待启动</button><button class="filter" data-filter="done" aria-pressed="false">已交付</button><button class="filter" data-filter="stopped" aria-pressed="false">已停止</button>
  </div>
  <div class="task-list-columns" aria-hidden="true"><span>任务与当前工作</span><span>验收进度</span><span>下一步操作</span></div>
  <div id="task-rows" class="task-list" data-page-list="tasks"></div>
  <div id="tasks-pagination" class="list-pagination"></div>
  <div class="empty-state" id="empty-state" hidden><span class="empty-icon"><svg><use href="#i-terminal" /></svg></span><h3 id="empty-title">下一个交付，从这里开始</h3><p id="empty-description">添加一个开发任务，让执行器开始实现，让监督器持续跟进。</p><button class="button secondary" id="empty-create"><svg><use href="#i-plus" /></svg>创建第一个任务</button></div>
  <div class="task-list-footer"><span id="table-caption">正在加载任务…</span><span id="last-updated">等待同步</span></div>
</section>
