<h1>Auto Monitor 角色协作时序图</h1>

<h2 id="main-heading">从需求到交付</h2>

<section aria-labelledby="recovery-heading">
<h2 id="recovery-heading">现场补证与异常接续</h2>
<p>Reviewer 核对现场证据。裁判在启用后负责恢复路径，Guardian 处理 Watcher 进程意外退出。</p>
