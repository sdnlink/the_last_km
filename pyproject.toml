[project]
name = "auto-moniter"
version = "0.4.1"
description = "Supervise coding agents until an independent review accepts the work."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
languages = [
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==0.9.0",
]

[project.scripts]
auto-moniter = "auto_moniter.cli:main"
auto-moniter-console = "console.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auto_moniter*", "console*"]

[tool.setuptools.package-data]
console = ["static/*", "static/pages/*", "static/fragments/*"]

[tool.setuptools.data-files]
"share/doc/auto-moniter" = ["README.md", "README.zh-CN.md", "OPERATIONS.md", "CHANGELOG.md", "QUALITY_POLICY.md", "ACCEPTANCE_GUIDE.md", "WORKFLOW.md"]
"share/doc/auto-moniter/deploy" = ["deploy/auto-moniter@.service", "deploy/task.example.json"]
"share/doc/auto-moniter/tools" = ["tools/soak.py", "tools/certify_backend.py", "tools/check_documentation.py"]
